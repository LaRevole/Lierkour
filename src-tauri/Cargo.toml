[package]
name = "lierkour-app"
version = "2.0.0"
edition = "2024"
authors = ["LaRevole"]
license = "MIT"
description = "Tauri 2 host application for Lierkour - Keeper of Completed Media"

[features]
# Production builds must embed the frontend assets instead of loading
# `build.devUrl`. Keeping this feature in `default` makes a plain
# `cargo build --release` work on both Windows and Linux; the Tauri CLI
# automatically strips it when running `tauri dev`.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
lierkour-core = { path = "../crates/core" }

