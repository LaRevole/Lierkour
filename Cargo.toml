[package]
name = "my-film-library"
version = "1.1.2"
edition = "2024"
rust-version = "1.95"
description = "Локальная фильмотека: Rust + egui + SQLite"
license = "MIT"
repository = "https://github.com/LaRevole/MyFilmLibrary"

[dependencies]
anyhow = "1.0"
thiserror = "2.0"

# SQLite встроен в бинарник (feature "bundled"), поэтому системный SQLite не нужен.
rusqlite = { version = "0.41", features = ["bundled"] }

# glow-рендерер легче wgpu и отлично работает на Windows/Linux.
# feature "clipboard" обязателен: без него Ctrl+V в текстовых полях не работает.
# feature "links" открывает ссылки (например, страницу ключа OMDb) в браузере.
eframe = { version = "0.37", default-features = false, features = [
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "wayland",
    "x11",
] }

# Буфер обмена с поддержкой изображений (feature image-data включён по умолчанию).
arboard = "3.7"

rfd = "0.17"
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
    "webp",
] }
dirs = "7.0"

# JSON-экспорт/импорт фильмографии и разбор ответов OMDb.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"

# ZIP-архив для переноса библиотеки вместе с обложками.
zip = { version = "2.4", default-features = false, features = ["deflate"] }

# HTTP-клиент для необязательного автозаполнения через OMDb.
# rustls не требует системного OpenSSL, поэтому сборка переносима.
ureq = { version = "3.5", default-features = false, features = [
    "gzip",
    "json",
    "rustls",
] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
