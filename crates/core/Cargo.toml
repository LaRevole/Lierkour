[package]
name = "myfilmlibrary-core"
version = "1.2.0"
edition = "2024"
authors = ["LaRevole"]
license = "MIT"
description = "Core business logic, models, and database layer for MyFilmLibrary"

[dependencies]
anyhow = "1.0"
thiserror = "2.0"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
    "webp",
] }
dirs = "7.0"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
ureq = { version = "3.5", default-features = false, features = [
    "gzip",
    "json",
    "rustls",
] }

